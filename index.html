<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f1;--card:#fff;--ink:#16221e;--mute:#66756f;--brand:#14463c;--accent:#e8a317;--line:#dde4de;--bad:#b3392f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1815;--card:#18241f;--ink:#e8efeb;--mute:#93a39b;--brand:#4fb59d;--line:#2b3a34}}
*{box-sizing:border-box}
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:28px 16px 22px;text-align:center}
@media(prefers-color-scheme:dark){header{color:#0f1815}}
header h1{margin:0;font-size:clamp(28px,7vw,44px);font-weight:800;letter-spacing:-.5px}
header p{margin:6px 0 0;opacity:.8}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:20px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
@media(prefers-color-scheme:dark){.tabs button.on{color:#0f1815}}
main{max-width:1000px;margin:0 auto;padding:20px 16px 50px}
h2{font-size:22px;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.card img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line)}
.body{padding:12px 14px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.body b{font-size:17px}
.price{font-weight:800;color:var(--brand);font-size:18px;white-space:nowrap}
.card.off img,.card.off .ph{filter:grayscale(1);opacity:.45}
.card.off .body{opacity:.55}
.card.off .price{text-decoration:line-through}
.badge{position:absolute;top:10px;left:10px;background:var(--bad);color:#fff;font-size:13px;font-weight:600;padding:5px 10px;border-radius:6px}
.empty{text-align:center;color:var(--mute);padding:60px 0}
</style>
</head>
<body>
<header><h1 id="rname">Menu</h2><p> लक्ष्मीपुर लौखान चौक पंजाब नेशनल बैंक के सामने ढाका घोडासहन रोड  845418</p></header>
<nav class="tabs" id="tabs"></nav>
<main id="menu"></main>

<script>
const KEY="rm_menu_v1";
let data={name:"",items:[]}, active="All";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!d||!d.items){ // online hosting: menu-data.json se padhein
    try{ const r=await fetch('menu-data.json?'+Date.now()); d=await r.json(); }catch(e){}
  }
  if(d&&d.items) data=d;
  draw();
}

function draw(){
  document.getElementById('rname').textContent=data.name||"Menu";
  document.title=(data.name||"Menu");
  const cats=[...new Set(data.items.map(i=>i.cat))];
  if(active!=="All"&&!cats.includes(active)) active="All";
  document.getElementById('tabs').innerHTML=['All',...cats].map(c=>`<button class="${c===active?'on':''}" onclick="active='${esc(c).replace(/'/g,"\\'")}';draw()">${c==='All'?'Sab':esc(c)}</button>`).join('');
  const show=cats.filter(c=>active==="All"||c===active);
  document.getElementById('menu').innerHTML=show.length? show.map(c=>`
    <h2>${esc(c)}</h2>
    <div class="grid">${data.items.filter(i=>i.cat===c).map(i=>`
      <div class="card ${i.avail?'':'off'}">
        ${i.avail?'':'<span class="badge">Not available</span>'}
        ${i.img?`<img src="${i.img}" alt="${esc(i.name)}" loading="lazy">`:'<div class="ph"></div>'}
        <div class="body"><b>${esc(i.name)}</b><span class="price">₹${i.price}</span></div>
      </div>`).join('')}</div>`).join('') : '<p class="empty">Menu jald hi aayega.</p>';
}

window.addEventListener('storage',e=>{ if(e.key===KEY) load(); });
load();
</script>
</body>
</html>
